function docRun(r){let h='';for(const c of r.children){if(c.localName=='t')h+=esc(c.textContent);else if(c.localName=='tab')h+='&emsp;';else if(c.localName=='br')h+='<br>';else if(['drawing','pict','AlternateContent'].includes(c.localName))h+=drawn(c)}
 const rp=wk(r,'rPr')[0];if(rp){const on=t=>{const x=wk(rp,t)[0];return x&&x.getAttributeNS(WNS,'val')!='0'&&x.getAttributeNS(WNS,'val')!='false'};
  if(on('b'))h='<b>'+h+'</b>';if(on('i'))h='<i>'+h+'</i>';if(on('u'))h='<u>'+h+'</u>'}return h}
function docPara(p){let h='';const walk=el=>{for(const c of el.children){if(c.localName=='r')h+=docRun(c);else if(c.localName=='hyperlink'||c.localName=='ins'||c.localName=='smartTag')walk(c)}};walk(p);
 const pp=wk(p,'pPr')[0];let tag='p',pre='';if(pp){const st=wk(pp,'pStyle')[0],sv=st?st.getAttributeNS(WNS,'val'):'';const m=/^(?:Heading|heading)\s?(\d)/.exec(sv);if(m)tag='h'+Math.min(6,+m[1]+1);else if(/^Title$/i.test(sv))tag='h2';
  if(wk(pp,'numPr')[0]||/^List/i.test(sv))pre='• ';const jc=wk(pp,'jc')[0];}
 return h.trim()||pre?`<${tag} style="margin:6px 0">${pre}${h||'&nbsp;'}</${tag}>`:'<div style="height:8px"></div>'}
function docBody(el){let h='';for(const c of el.children){if(c.localName=='p')h+=docPara(c);else if(c.localName=='tbl'){h+='<table style="border:1px solid #bbb;margin:8px 0">'+wk(c,'tr').map(tr=>'<tr>'+wk(tr,'tc').map(tc=>'<td style="border:1px solid #ccc;padding:4px;vertical-align:top">'+docBody(tc)+'</td>').join('')+'</tr>').join('')+'</table>'}}return h}
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1}
function xlsSheets(files){const ss=files['xl/sharedStrings.xml']?[...xml(files['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
 const wb=xml(files['xl/workbook.xml']),rels={};[...xml(files['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].forEach(r=>rels[r.getAttribute('Id')]=r.getAttribute('Target'));
 return [...wb.getElementsByTagName('sheet')].map(sh=>{const rid=sh.getAttribute('r:id')||[...sh.attributes].find(a=>a.localName=='id').value;let t=rels[rid]||'';t=t.replace(/^\/?(xl\/)?/,'xl/');const sx=files[t];
  const rows=[];let trunc=false;if(sx){const d=xml(sx);const rs=[...d.getElementsByTagName('row')];for(const r of rs){if(rows.length>=500){trunc=true;break}const cells=[];
   for(const c of r.children){if(c.localName!='c')continue;const i=colIdx(c.getAttribute('r')||'A1');if(i>60)continue;const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],is=c.getElementsByTagName('is')[0];let val='';
    if(ty=='s'&&v)val=ss[+v.textContent]||'';else if(ty=='inlineStr'&&is)val=[...is.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(ty=='b'&&v)val=v.textContent=='1'?'TRUE':'FALSE';else if(v)val=v.textContent;cells[i]=val}rows.push(cells)}}
  return{name:sh.getAttribute('name'),rows,trunc}})}
function xlsHtml(sh){const w=Math.max(0,...sh.rows.map(r=>r.length));if(!sh.rows.length)return'<p class="muted">الورقة فاضية</p>';
 return`<div style="overflow:auto;max-height:60vh"><table style="direction:ltr;border:1px solid #bbb">`+sh.rows.map(r=>'<tr>'+Array.from({length:w},(_,i)=>`<td style="border:1px solid #ddd;padding:3px 6px;white-space:nowrap">${esc(r[i]??'')}</td>`).join('')+'</tr>').join('')+`</table></div>`+(sh.trunc?'<p class="muted">اتعرض أول 500 صف بس. نزّل الأصل للباقي.</p>':'')}
let xlsCache=null;function xlsPick(i){const b=$('xlsbody');b.innerHTML=xlsHtml(xlsCache[i]);[...document.querySelectorAll('.shb')].forEach((x,j)=>x.className='btn shb'+(j==i?'':' alt'))}
async function prevOffice(f,rid){const ext=extOf(f.name);

function parseCSV(s){const rows=[];let r=[],c='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];
 if(q){if(ch=='"'&&s[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
 else if(ch=='"')q=true;else if(ch==','||ch==';'){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
function importCSV(){show(`<h3>استيراد موردين</h3><p class="muted">من Excel احفظ الملف كـ CSV. الأعمدة: اسم المورد، التاريخ (YYYY-MM-DD)، الدرجة، ملاحظات، تاريخ الانتهاء (اختياري). السطر الأول عناوين.</p>
 <input type="file" accept=".csv,text/csv" onchange="previewCSV(this.files[0])"><div id="pv"></div>
 <div class="row" style="margin-top:12px"><button class="btn alt" onclick="hide()">إغلاق</button></div>`)}
let pending=[];const DRE=/^\d{4}-\d{2}-\d{2}$/;
async function previewCSV(f){if(!f)return;const rows=parseCSV(await f.text()).slice(1).filter(r=>r.some(x=>x.trim()));
 pending=[];const seen=new Set();const html=rows.map((r,i)=>{const w=[];const name=(r[0]||'').trim(),date=(r[1]||'').trim(),score=(r[2]||'').trim(),ex=(r[4]||'').trim();
  if(!name)w.push('اسم المورد فاضي');if(date&&!DRE.test(date))w.push('تاريخ غير صالح');if(score&&isNaN(+score))w.push('الدرجة مش رقم');if(ex&&!DRE.test(ex))w.push('تاريخ الانتهاء غير صالح');
  if(name&&(DB.records.some(x=>x.area=='suppliers'&&x.title==name)||seen.has(name)))w.push('اسم موجود قبل كده (اتخطى)');seen.add(name);
  const bad=w.length>0;if(!bad)pending.push({name,date:DRE.test(date)?date:today(),score,notes:(r[3]||'').trim(),expires:ex||null});
  return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${esc(date)}</td><td>${esc(score)}</td><td class="${w.length?'warn':'ok'}">${w.join('، ')||'سليم'}</td></tr>`}).join('');
 $('pv').innerHTML=`<table><tr><th>#</th><th>المورد</th><th>التاريخ</th><th>الدرجة</th><th>تحذيرات</th></tr>${html}</table>
 <p>${pending.length} صف سيتم استيراده (الصفوف الغلط بتتخطى). <button class="btn" onclick="confirmImport()">تأكيد الاستيراد</button></p>`}
async function confirmImport(){if(!pending.length){hide();return}
 try{const rows=pending.map(p=>({area:'suppliers',title:p.name,date:p.date,status:'review',extra:p.score?'درجة التقييم: '+p.score:'',notes:p.notes,expires:p.expires}));
 const r=await rest('records','POST',rows);r.forEach(z=>{z.files=[];DB.records.unshift(z)});await logit(`استيراد ${rows.length} مورد من CSV`);hide();render()}catch(e){alert(e.message)}}
